name: ci
on: [push, pull_request]
jobs:
  lanes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [vitest, bun]
        engine: [pglite, postgres]
    services:
      # The real-Postgres lane is pinned to production's major version.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feather_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/feather_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install
      - run: npm run typecheck
      - run: npm run test:${{ matrix.runner }}:${{ matrix.engine }}
